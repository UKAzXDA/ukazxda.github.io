<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UKAzXDA - Portfolio & Tech Stack">
    <meta name="theme-color" content="#f2f2f7">
    <title>UKAzXDA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        ios: {
                            bg: '#f2f2f7',
                            card: 'rgba(255, 255, 255, 0.72)',
                            blue: '#007aff',
                            'blue-hover': '#0062cc',
                            text: '#1c1c1e',
                            secondary: '#8e8e93',
                            border: 'rgba(255, 255, 255, 0.85)',
                        }
                    },
                    boxShadow: {
                        'ios-card': '0 20px 40px -15px rgba(0, 0, 0, 0.05), 0 0 1px 1px rgba(255, 255, 255, 0.9) inset',
                        'ios-modal': '0 25px 60px -10px rgba(0, 0, 0, 0.25)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f2f2f7;
            color: #1c1c1e;
            overflow-x: hidden;
        }
        .ios-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .ios-glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.85);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ios-glass-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(255, 255, 255, 1) inset;
        }
        @keyframes blob-float-1 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.12); }
        }
        @keyframes blob-float-2 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-50px, 50px) scale(0.92); }
        }
        .animate-blob-1 { animation: blob-float-1 14s ease-in-out infinite; }
        .animate-blob-2 { animation: blob-float-2 18s ease-in-out infinite; }
        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .scroll-reveal.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .ios-btn {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .ios-btn:active {
            transform: scale(0.94) !important;
        }
        .modal-active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        .modal-active .modal-content {
            transform: scale(1) translateY(0) !important;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }
    </style>
</head>
<body class="font-sans antialiased min-h-screen relative flex flex-col justify-between selection:bg-blue-500 selection:text-white">
    
    <!-- Background Blobs -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-32 -left-20 w-[35rem] h-[35rem] bg-blue-200/40 rounded-full blur-3xl animate-blob-1"></div>
        <div class="absolute top-1/3 -right-20 w-[40rem] h-[40rem] bg-indigo-200/30 rounded-full blur-3xl animate-blob-2"></div>
        <div class="absolute -bottom-32 left-1/4 w-[38rem] h-[38rem] bg-sky-200/40 rounded-full blur-3xl animate-blob-1"></div>
    </div>

    <!-- Main Container -->
    <div class="relative z-10 my-8 md:my-12">
        <main class="container mx-auto px-4 max-w-4xl space-y-8">
            
            <!-- Profile Section -->
            <section class="profile text-center scroll-reveal visible">
                <div class="ios-glass-card p-6 md:p-10 rounded-[2.5rem] shadow-ios-card relative overflow-hidden">
                    <div class="relative inline-block mb-3">
                        <div class="p-1 rounded-full bg-gradient-to-tr from-blue-500 via-sky-400 to-indigo-500 shadow-xl">
                            <img 
                                src="pixel/perfil.png" 
                                alt="UKAzXDA Profile" 
                                class="w-28 h-28 md:w-36 md:h-36 rounded-full object-cover border-4 border-white shadow-inner transition duration-500 transform hover:scale-105"
                                onerror="this.src='https://ui-avatars.com/api/?name=UKAzXDA&background=007aff&color=fff&size=256'"
                            >
                        </div>
                        <!-- Selo Verificado (Esquerda da foto)
                        <span class="absolute bottom-2 left-2 bg-blue-500 text-white rounded-full w-7 h-7 flex items-center justify-center border-2 border-white text-xs shadow-md" title="Desenvolvedor Verificado">
                            <i class="fas fa-check"></i>
                        </span> -->
                        <span class="absolute bottom-2 right-2 bg-gradient-to-r from-teal-500 to-cyan-500 text-white rounded-full w-7 h-7 flex items-center justify-center border-2 border-white text-xs shadow-md" title="Orgulho TEA / Neurodivergente">
                            <i class="fas fa-puzzle-piece text-[11px]"></i>
                        </span>
                    </div>

                    <h1 class="text-3xl md:text-5xl font-extrabold text-gray-900 tracking-tight">UKAzXDA</h1>
                    <div class="mt-4 flex flex-wrap justify-center items-center gap-2 text-xs font-mono max-w-2xl mx-auto">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-500/10 text-teal-700 border border-teal-500/20 shadow-sm" title="Neurodivergente / TEA">
                            <i class="fas fa-puzzle-piece text-[11px]"></i> Neurodivergente
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-500/10 text-blue-700 border border-blue-500/20 shadow-sm" title="Sistemas Digitais e Processamento Binário (1 e 0)">
                            <i class="fas fa-toggle-on text-[11px]"></i> Lógica Booleana
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-500/10 text-blue-700 border border-blue-500/20 shadow-sm">
                            <i class="fas fa-microchip text-[11px]"></i> Eletrônica
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-700 border border-indigo-500/20 shadow-sm">
                            <i class="fas fa-code text-[11px]"></i> Programação
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyan-500/10 text-cyan-700 border border-cyan-500/20 shadow-sm">
                            <i class="fas fa-atom text-[11px]"></i> Física
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-500/10 text-teal-700 border border-teal-500/20 shadow-sm">
                            <i class="fas fa-flask text-[11px]"></i> Química
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-purple-500/10 text-purple-700 border border-purple-500/20 shadow-sm">
                            <i class="fas fa-brain text-[11px]"></i> IA
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-700 border border-emerald-500/20 shadow-sm">
                            <i class="fas fa-diagram-project text-[11px]"></i> Algoritmos
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/10 text-amber-700 border border-amber-500/20 shadow-sm">
                            <i class="fas fa-gears text-[11px]"></i> Engenharia
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-rose-500/10 text-rose-700 border border-rose-500/20 shadow-sm">
                            <i class="fas fa-calculator text-[11px]"></i> Matemática
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-500/10 text-sky-700 border border-sky-500/20 shadow-sm">
                            <i class="fas fa-cube text-[11px]"></i> Modelagem 3D
                        </span>
                    </div>

                    <!-- Links Sociais -->
                    <div class="social-links mt-6 flex justify-center items-center gap-3">
                        <a href="https://github.com/ukazxda" target="_blank" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-gray-900 hover:bg-black text-white text-xs font-semibold shadow-md transition-all ios-btn">
                            <i class="fab fa-github text-base"></i>
                            <span>GitHub Repos</span>
                        </a>
                        <a href="https://t.me/LimpoROMgrupo" target="_blank" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-blue-500 hover:bg-blue-600 text-white text-xs font-semibold shadow-md shadow-blue-500/20 transition-all ios-btn">
                            <i class="fab fa-telegram text-base"></i>
                            <span>Comunidade</span>
                        </a>
                    </div>
                </div>
            </section>

            <!-- Projects Grid Section -->
            <section id="dev-projects" class="scroll-reveal">
                <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="ios-glass-card p-6 rounded-3xl animate-pulse flex flex-col gap-3">
                        <div class="h-5 bg-gray-200/80 rounded-lg w-1/2"></div>
                        <div class="h-4 bg-gray-200/60 rounded-lg w-3/4"></div>
                        <div class="h-20 bg-gray-200/40 rounded-xl w-full mt-2"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Fixed Project Modal Container -->
    <div id="project-modal" class="fixed inset-0 z-50 flex items-center justify-center p-3 md:p-6 bg-black/40 backdrop-blur-xl opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="modal-content relative w-full max-w-5xl h-[85vh] md:h-[90vh] bg-white/90 backdrop-blur-3xl rounded-[2rem] md:rounded-[2.5rem] shadow-ios-modal flex flex-col overflow-hidden border border-white/60 transform scale-95 translateY-4 transition-transform duration-300">
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-5 py-3.5 bg-white/60 border-b border-gray-200/60 select-none">
                <div class="flex items-center gap-2.5">
                    <div class="flex gap-1.5">
                        <button onclick="closeProjectModal()" class="w-3.5 h-3.5 rounded-full bg-red-500 hover:bg-red-600 transition shadow-sm"></button>
                        <span class="w-3.5 h-3.5 rounded-full bg-yellow-400 shadow-sm"></span>
                        <span class="w-3.5 h-3.5 rounded-full bg-green-500 shadow-sm"></span>
                    </div>
                    <span id="modal-title" class="font-bold text-xs md:text-sm text-gray-800 tracking-tight ml-2 truncate max-w-[200px] md:max-w-md">Visualizador de Projeto</span>
                </div>
                <div class="flex items-center gap-2">
                    <a id="modal-external-link" href="#" target="_blank" class="px-3 py-1.5 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold transition ios-btn flex items-center gap-1">
                        <i class="fas fa-external-link-alt text-[10px]"></i>
                        <span class="hidden md:inline">Nova Aba</span>
                    </a>
                    <button onclick="closeProjectModal()" class="w-7 h-7 md:w-8 md:h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-700 flex items-center justify-center transition ios-btn">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
            </div>
            <!-- Modal Frame -->
            <div class="flex-1 w-full bg-white relative">
                <iframe id="project-iframe" class="w-full h-full border-none" src=""></iframe>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="relative z-10 py-6 text-center text-xs font-semibold text-gray-500 ios-glass border-t border-white/80 mt-8">
        <div>© UKAzXDA</div>
    </footer>

    <!-- Logic Script -->
    <script>
        const devProjects = [
            "dev/on7xelte/Custom ROMs/Limpo ROMs J7 Prime.html",
            "dev/apps/Converter GIF Para Live Photo.html"
        ];

        async function loadProjects() {
            const container = document.getElementById("projects-container");
            container.innerHTML = "";
            
            if (devProjects.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full ios-glass-card p-8 rounded-3xl text-center text-gray-500 text-xs">
                        <i class="fas fa-folder-open text-2xl mb-2 text-gray-400"></i>
                        <p>Nenhum projeto cadastrado na lista!</p>
                    </div>
                `;
                return;
            }

            for (const path of devProjects) {
                const fileName = path.split('/').pop();
                const meta = await extractHtmlMeta(path, fileName);
                renderProjectCard(container, meta, path);
            }
        }

        async function extractHtmlMeta(filePath, fileName) {
            try {
                const res = await fetch(filePath);
                if (!res.ok) throw new Error();
                const text = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const title = doc.querySelector('title')?.innerText || fileName.replace('.html', '');
                return { title };
            } catch {
                return {
                    title: fileName.replace('.html', ''),
                };
            }
        }

        function renderProjectCard(container, project, path) {
            const card = document.createElement("div");
            card.className = "ios-glass-card p-6 rounded-3xl shadow-ios-card flex flex-col justify-between border border-white/80 group";
            card.innerHTML = `
                <div>
                    <h3 class="text-base md:text-lg font-bold text-gray-900 group-hover:text-blue-600 transition-colors tracking-tight">${project.title}</h3>
                </div>
                <div class="flex items-center gap-2 mt-6 pt-3 border-t border-gray-200/50">
                    <button onclick="openProjectModal('${path}', '${project.title.replace(/'/g, "\\'")}')" class="flex-1 py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs font-semibold shadow-md shadow-blue-500/20 transition ios-btn flex items-center justify-center gap-1.5">
                        <i class="fas fa-play text-[10px]"></i> Abrir Projeto
                    </button>
                    <a href="${path}" target="_blank" class="px-3 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-semibold transition ios-btn" title="Abrir em Nova Aba">
                        <i class="fas fa-external-link-alt"></i>
                    </a>
                </div>
            `;
            container.appendChild(card);
        }

        function openProjectModal(url, title) {
            const modal = document.getElementById('project-modal');
            const iframe = document.getElementById('project-iframe');
            const modalTitle = document.getElementById('modal-title');
            const extLink = document.getElementById('modal-external-link');

            iframe.src = url;
            modalTitle.innerText = title;
            extLink.href = url;
            
            modal.classList.add('modal-active');
            document.body.style.overflow = 'hidden';
        }

        function closeProjectModal() {
            const modal = document.getElementById('project-modal');
            const iframe = document.getElementById('project-iframe');
            
            modal.classList.remove('modal-active');
            setTimeout(() => {
                iframe.src = '';
            }, 300);
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeProjectModal();
        });

        document.addEventListener("DOMContentLoaded", () => {
            loadProjects();
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
