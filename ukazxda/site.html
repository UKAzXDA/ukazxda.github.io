    <script>
        tailwind.config = {

    <style>
        body {
            background-color: #f2f2f7;
            color: #1c1c1e;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .ios-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .ios-glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.85);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ios-glass-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(255, 255, 255, 1) inset;
        }
        @keyframes blob-float-1 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.12); }
        }
        @keyframes blob-float-2 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-50px, 50px) scale(0.92); }
        }
        .animate-blob-1 { animation: blob-float-1 14s ease-in-out infinite; }
        .animate-blob-2 { animation: blob-float-2 18s ease-in-out infinite; }
        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .scroll-reveal.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .ios-btn {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .ios-btn:active {
            transform: scale(0.94) !important;
        }
        :focus-visible {
            outline: 3px solid #2563eb;
            outline-offset: 3px;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
            .scroll-reveal {
                opacity: 1;
                transform: none;
            }
        }

        /* Comportamento do Modal Adaptável para Mobile */
        #project-modal {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
        }
        #project-modal.modal-active {
            opacity: 1;
            pointer-events: auto;
        }
        #project-modal .modal-content {
            transform: scale(0.96) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #project-modal.modal-active .modal-content {
            transform: scale(1) translateY(0);
        }

        /* Header Responsivo com Blur no Modal */
        @keyframes profileHeaderEnter {
            0% { opacity: 0; filter: blur(10px); transform: translateY(-8px) scale(0.96); }
            100% { opacity: 1; filter: blur(0px); transform: translateY(0) scale(1); }
        }
        .modal-header-anim {
            opacity: 0;
            filter: blur(10px);
            transform: translateY(-8px) scale(0.96);
        }
        .modal-active .modal-header-anim {
            animation: profileHeaderEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.05s;
        }

        #modal-content-box {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100dvh; /* dvh suporta a barra de endereços dinamicamente em celulares */
            border-radius: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Iframe responsivo para evitar quebras em telas pequenas */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.35); }
    </style>

<body class="font-sans antialiased min-h-screen relative flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Fixed Project Modal Container -->
    <div id="project-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md" aria-hidden="true" inert>
        <div id="modal-content-box" class="modal-content relative bg-white flex flex-col overflow-hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-4 sm:px-6 py-3 sm:py-4 bg-white/90 backdrop-blur-md border-b border-gray-200/80 select-none shrink-0 z-10">
                <div class="flex items-center gap-2 sm:gap-3 modal-header-anim overflow-hidden">
                    <img src="pixel/perfil.png" alt="UKAzXDA" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full object-cover border border-gray-200 shadow-sm shrink-0" onerror="this.src='https://ui-avatars.com/api/?name=UKAzXDA&background=007aff&color=fff&size=64'">

    <!-- Footer -->
    <footer class="relative z-10 py-5 text-center text-xs font-semibold text-gray-500 ios-glass border-t border-white/80 mt-8">

    <!-- Logic Script -->
    <script>
        // PROJETOS_START
const devProjects = [
    {
        type: "modal",
        path: "dev/on7xelte/Custom ROMs/Limpo ROMs J7 Prime.html",
        title: "Limpo ROMs J7 Prime",
        description: "ROMs personalizadas que desenvolvi para o Samsung Galaxy J7 Prime.",
        tags: ["Android", "Custom ROM"]
    },
    {
        type: "links",
        title: "Marlin de alta velocidade — Neptune 3 Pro",
        description: "Desenvolvi e testei este firmware Marlin 2.1.1 na minha Neptune 3 Pro. No meu teste, alcancei qualidade de impressão e velocidade comparáveis ao perfil padrão da Neptune 4 Pro. Também confirmei compatibilidade com uma versão recente da tela LCD.",
        tags: ["Marlin", "STM32F401RC", "Impressão 3D"],
        links: [
            {
                url: "https://github.com/UKAzXDA/neptune-3-pro-marlin-speed4pro",
                label: "Código e detalhes",
                icon: "fab fa-github"
            },
            {
                url: "https://github.com/UKAzXDA/neptune-3-pro-marlin-speed4pro/releases/download/v1.0.0/ZNP_ROBIN_NANO.bin",
                label: "Baixar firmware",
                icon: "fas fa-download"
            }
        ],
        note: "Antes de instalar meu firmware, confira os requisitos, riscos e informações sobre garantia no repositório."
    }
];
// PROJETOS_END

        function loadProjects() {
            const container = document.getElementById("projects-container");
            container.innerHTML = "";

            if (!devProjects || devProjects.length === 0) {
                const emptyState = document.createElement("p");
                emptyState.className = "col-span-full ios-glass-card p-8 rounded-3xl text-center text-gray-500 text-sm";
                emptyState.textContent = "Nenhum projeto publicado no momento.";
                container.appendChild(emptyState);
                return;
            }

            devProjects.forEach(proj => renderProjectCard(container, proj));
        }

        function renderProjectCard(container, proj) {
            const card = document.createElement("article");
            card.className = "ios-glass-card p-5 sm:p-6 rounded-2xl sm:rounded-3xl shadow-ios-card flex flex-col border border-white/80 group";

            const title = document.createElement("h3");
            title.className = "text-base sm:text-lg font-bold text-gray-900 tracking-tight";
            title.textContent = proj.title;
            card.appendChild(title);

            const description = document.createElement("p");
            description.className = "mt-3 text-sm leading-6 text-gray-600";
            description.textContent = proj.description;
            card.appendChild(description);

            if (proj.tags && proj.tags.length) {
                const tags = document.createElement("ul");
                tags.className = "mt-4 flex flex-wrap gap-2";
                tags.setAttribute("aria-label", "Tecnologias e categorias");
                proj.tags.forEach(tag => {
                    const item = document.createElement("li");
                    item.className = "rounded-full bg-blue-50 px-3 py-1 text-[11px] font-semibold text-blue-700";
                    item.textContent = tag;
                    tags.appendChild(item);
                });
                card.appendChild(tags);
            }

            if (proj.note) {
                const note = document.createElement("p");
                note.className = "mt-4 rounded-xl bg-amber-50 px-3 py-2 text-xs leading-5 text-amber-900";
                note.textContent = proj.note;
                card.appendChild(note);
            }

            const actions = document.createElement("div");
            actions.className = "mt-auto flex flex-wrap gap-2 border-t border-gray-200/50 pt-4 sm:mt-6";

            if (proj.type === "modal") {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "ios-btn flex-1 rounded-xl bg-blue-500 px-4 py-2.5 text-xs font-semibold text-white shadow-md shadow-blue-500/20 transition hover:bg-blue-600";
                button.textContent = "Abrir projeto";
                button.addEventListener("click", () => openProjectModal(proj.path, proj.title));
                actions.appendChild(button);
            }

            (proj.links || []).forEach(link => {
                const anchor = document.createElement("a");
                anchor.href = link.url;
                anchor.target = "_blank";
                anchor.rel = "noopener noreferrer";
                anchor.className = "ios-btn flex-1 rounded-xl bg-blue-500 px-4 py-2.5 text-center text-xs font-semibold text-white shadow-md shadow-blue-500/20 transition hover:bg-blue-600";
                const icon = document.createElement("i");
                icon.className = link.icon + " mr-1.5";
                icon.setAttribute("aria-hidden", "true");
                anchor.append(icon, document.createTextNode(link.label));
                actions.appendChild(anchor);
            });

            card.appendChild(actions);

            container.appendChild(card);
        }

        let previouslyFocusedElement = null;

        function openProjectModal(url, title) {
            const modal = document.getElementById('project-modal');
            const iframe = document.getElementById('project-iframe');
            const modalTitle = document.getElementById('modal-title');
            previouslyFocusedElement = document.activeElement;
            modalTitle.textContent = title;
            modal.classList.add('modal-active');
            modal.setAttribute('aria-hidden', 'false');
            modal.inert = false;
            document.body.style.overflow = 'hidden';
            iframe.src = url;
            document.getElementById('modal-close').focus();
        }

        function closeProjectModal() {
            const modal = document.getElementById('project-modal');
            const iframe = document.getElementById('project-iframe');

            if (modal.getAttribute('aria-hidden') === 'true') return;
            modal.classList.remove('modal-active');
            modal.setAttribute('aria-hidden', 'true');
            modal.inert = true;
            iframe.src = 'about:blank';
            document.body.style.overflow = '';
            if (previouslyFocusedElement) previouslyFocusedElement.focus();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeProjectModal();
        });

        document.addEventListener("DOMContentLoaded", () => {
            loadProjects();
            document.getElementById("current-year").textContent = new Date().getFullYear();
            document.getElementById("modal-close").addEventListener("click", closeProjectModal);
            document.getElementById("project-modal").addEventListener("click", event => {
                if (event.target.id === "project-modal") closeProjectModal();
            });

            if ("IntersectionObserver" in window && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                document.querySelectorAll('.scroll-reveal:not(.visible)').forEach(el => observer.observe(el));
            } else {
                document.querySelectorAll('.scroll-reveal').forEach(el => el.classList.add('visible'));
            }
        });
    </script>
