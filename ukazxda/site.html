    <style>
        body {
            background-color: #f2f2f7;
            color: #1c1c1e;

        }
        .ios-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .ios-glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.85);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ios-glass-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(255, 255, 255, 1) inset;
        }
        @keyframes blob-float-1 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.12); }
        }
        @keyframes blob-float-2 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-50px, 50px) scale(0.92); }
        }
        .animate-blob-1 { animation: blob-float-1 14s ease-in-out infinite; }
        .animate-blob-2 { animation: blob-float-2 18s ease-in-out infinite; }
        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .scroll-reveal.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .ios-btn {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .ios-btn:active {
            transform: scale(0.94) !important;
        }

        /* Comportamento do Modal Adaptável para Mobile */
        #project-modal {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
        }
        #project-modal.modal-active {
            opacity: 1;
            pointer-events: auto;
        }
        #project-modal .modal-content {
            transform: scale(0.96) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #project-modal.modal-active .modal-content {
            transform: scale(1) translateY(0);
        }

        /* Header Responsivo com Blur no Modal */
        @keyframes profileHeaderEnter {
            0% { opacity: 0; filter: blur(10px); transform: translateY(-8px) scale(0.96); }
            100% { opacity: 1; filter: blur(0px); transform: translateY(0) scale(1); }
        }
        .modal-header-anim {
            opacity: 0;
            filter: blur(10px);
            transform: translateY(-8px) scale(0.96);
        }
        .modal-active .modal-header-anim {
            animation: profileHeaderEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.05s;
        }

        #modal-content-box {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100dvh; /* dvh suporta a barra de endereços dinamicamente em celulares */
            border-radius: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Iframe responsivo para evitar quebras em telas pequenas */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.35); }

    <!-- Logic Script -->
    <script>
        // PROJETOS_START
const devProjects = [
    {
        "path": "dev/on7xelte/Custom ROMs/Limpo ROMs J7 Prime.html",
        "title": "Limpo ROMs J7 Prime"
    },
    {
        "path": "dev/ukaz/cafe.html",
        "title": "Apoie ❤️"
    },
    {
        "path": "dev/apps/Ps4 Gamepad Calibration Utility.html",
        "title": "PS4 DualShock 4 Precision Calibration Engine"
    }
];
// PROJETOS_END

        function loadProjects() {
            const container = document.getElementById("projects-container");
            container.innerHTML = "";
            
            if (!devProjects || devProjects.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full ios-glass-card p-8 rounded-3xl text-center text-gray-500 text-xs">
                        <i class="fas fa-folder-open text-2xl mb-2 text-gray-400"></i>
                        <p>Nenhum projeto ativo encontrado!</p>
                    </div>
                `;
                return;
            }
            
            for (const proj of devProjects) {
                renderProjectCard(container, proj);
            }
        }

        function renderProjectCard(container, proj) {
            const card = document.createElement("div");
            card.className = "ios-glass-card p-5 sm:p-6 rounded-2xl sm:rounded-3xl shadow-ios-card flex flex-col justify-between border border-white/80 group";
            
            card.innerHTML = `
                <div>
                    <h3 class="text-sm sm:text-base md:text-lg font-bold text-gray-900 group-hover:text-blue-600 transition-colors tracking-tight"></h3>
                </div>
                <div class="flex items-center gap-2 mt-4 sm:mt-6 pt-3 border-t border-gray-200/50">
                    <button type="button" class="btn-open w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs font-semibold shadow-md shadow-blue-500/20 transition ios-btn flex items-center justify-center gap-1.5">
                        <i class="fas fa-play text-[10px]"></i> Abrir Projeto
                    </button>
                </div>
            `;

            card.querySelector('h3').textContent = proj.title;
            
            card.querySelector('.btn-open').addEventListener('click', () => {
                openProjectModal(proj.path, proj.title);
            });

            container.appendChild(card);
        }

        function openProjectModal(url, title) {
            const modal = document.getElementById('project-modal');
            const iframe = document.getElementById('project-iframe');
            const modalTitle = document.getElementById('modal-title');
            
            modalTitle.innerText = title;
            modal.classList.add('modal-active');
            document.body.style.overflow = 'hidden';

            setTimeout(() => {
                iframe.src = url;
            }, 50);
        }

        function closeProjectModal() {
            const modal = document.getElementById('project-modal');
            const iframe = document.getElementById('project-iframe');
            
            modal.classList.remove('modal-active');
            
            setTimeout(() => {
                iframe.src = '';
            }, 250);
            
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeProjectModal();
        });

        document.addEventListener("DOMContentLoaded", () => {
            loadProjects();
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
        });
    </script>
