            0%, 100% { transform: translateY(0) rotate(0) scale(1); }
            40% { transform: translateY(-5px) rotate(-12deg) scale(1.2); }
            75% { transform: translateY(1px) rotate(5deg) scale(0.98); }
        }
        @keyframes blob-float-1 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.12); }
        }
        @keyframes blob-float-2 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-50px, 50px) scale(0.92); }
        }
        .animate-blob-1 { animation: blob-float-1 14s ease-in-out infinite; }
        .animate-blob-2 { animation: blob-float-2 18s ease-in-out infinite; }
        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);

        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;

                opacity: 1;

            }

        /* Comportamento do Modal Adaptável para Mobile */
        #project-modal {
            opacity: 0;
            pointer-events: none;

        /* Header Responsivo com Blur no Modal */

    <script>
        // PROJETOS_START
const devProjects = [
    {
        type: "modal",
        path: "dev/IA/como-ia-processa.html",
        icon: "fas fa-brain",
        category: "INTELIGÊNCIA ARTIFICIAL",
        title: "Como a IA Processa",
        description: "Simulador visual do fluxo de inferência, tokens e geração de resposta."
    },
    {
        type: "modal",
        path: "dev/ukaz/cafe.html",
        icon: "fas fa-coffee",
        category: "APOIO",
        title: "Apoie meu trabalho",
        description: "Contribua com café, energia, lanche ou servidor."
    },
    {
        type: "modal",
        path: "dev/on7xelte/Custom ROMs/Limpo ROMs J7 Prime.html",
        icon: "fab fa-android",
        category: "ANDROID",
        title: "Limpo ROMs",
        description: "ROMs para o Galaxy J7 Prime."
    },
    {
        type: "links",
        icon: "fas fa-microchip",
        category: "FIRMWARE",
        title: "Neptune 3 Pro",
        description: "Marlin 2.1.1 Speed 4 Pro.",
        links: [
            {
                url: "https://github.com/UKAzXDA/neptune-3-pro-marlin-speed4pro",
                label: "Código",
                icon: "fab fa-github"
            },
            {
                url: "https://github.com/UKAzXDA/neptune-3-pro-marlin-speed4pro/releases/download/v1.0.0/ZNP_ROBIN_NANO.bin",
                label: "Baixar",
                icon: "fas fa-download"
            }
        ]
    }
];
// PROJETOS_END

        function loadProjects() {
            const container = document.getElementById("projects-container");
            container.innerHTML = "";

            if (!devProjects || devProjects.length === 0) {
                const emptyState = document.createElement("p");
                emptyState.className = "col-span-full ios-glass-card p-8 rounded-3xl text-center text-gray-500 text-sm";
                emptyState.textContent = "Nenhum projeto publicado no momento.";
                container.appendChild(emptyState);
                return;
            }

            devProjects.forEach(proj => renderProjectCard(container, proj));
        }

        function renderProjectCard(container, proj) {
            const card = document.createElement("article");
            card.className = "project-card ios-glass-card p-5 sm:p-6 rounded-2xl sm:rounded-3xl shadow-ios-card flex flex-col border border-white/80 group";

            const heading = document.createElement("div");
            heading.className = "flex items-center gap-4";
            const iconTile = document.createElement("span");
            iconTile.className = "project-icon flex h-14 w-14 shrink-0 items-center justify-center text-2xl text-blue-600";
            iconTile.setAttribute("aria-hidden", "true");
            const icon = document.createElement("i");
            icon.className = proj.icon;
            iconTile.appendChild(icon);
            heading.appendChild(iconTile);

            const identity = document.createElement("div");
            const category = document.createElement("p");
            category.className = "text-[10px] font-bold tracking-[0.18em] text-blue-600";
            category.textContent = proj.category;
            const title = document.createElement("h3");
            title.className = "mt-1 text-base sm:text-lg font-bold text-gray-900 tracking-tight";
            title.textContent = proj.title;
            identity.append(category, title);
            heading.appendChild(identity);
            card.appendChild(heading);

            const description = document.createElement("p");
            description.className = "mt-5 text-sm leading-6 text-gray-600";
            description.textContent = proj.description;
            card.appendChild(description);

            const actions = document.createElement("div");
            actions.className = "mt-auto flex flex-wrap gap-2 pt-5";

            if (proj.type === "modal") {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "ios-btn flex-1 rounded-xl bg-blue-500 px-4 py-2.5 text-xs font-semibold text-white shadow-md shadow-blue-500/20 transition hover:bg-blue-600";
                button.setAttribute("aria-label", `Abrir ${proj.title}`);
                const buttonIcon = document.createElement("i");
                buttonIcon.className = "fas fa-arrow-up-right-from-square mr-1.5";
                buttonIcon.setAttribute("aria-hidden", "true");
                button.append(buttonIcon, document.createTextNode("Ver projeto"));
                button.addEventListener("click", () => openProjectModal(proj.path, proj.title));
                actions.appendChild(button);
            }

            (proj.links || []).forEach(link => {
                const anchor = document.createElement("a");
                anchor.href = link.url;
                anchor.target = "_blank";
                anchor.rel = "noopener noreferrer";
                anchor.className = "ios-btn flex-1 rounded-xl bg-blue-500 px-4 py-2.5 text-center text-xs font-semibold text-white shadow-md shadow-blue-500/20 transition hover:bg-blue-600";
                anchor.setAttribute("aria-label", link.label === "Baixar" ? "Baixar firmware Marlin" : "Ver código e informações do projeto Marlin");
                const icon = document.createElement("i");
                icon.className = link.icon + " mr-1.5";
                icon.setAttribute("aria-hidden", "true");
                anchor.append(icon, document.createTextNode(link.label));
                actions.appendChild(anchor);
            });

            card.appendChild(actions);

            container.appendChild(card);
        }

        let previouslyFocusedElement = null;

        function openProjectModal(url, title) {
            const modal = document.getElementById('project-modal');
            const iframe = document.getElementById('project-iframe');
            const modalTitle = document.getElementById('modal-title');
            previouslyFocusedElement = document.activeElement;
            modalTitle.textContent = title;
            modal.classList.add('modal-active');
            modal.setAttribute('aria-hidden', 'false');
            modal.inert = false;
            document.body.style.overflow = 'hidden';
            iframe.src = url;
            document.getElementById('modal-close').focus();
        }

        function closeProjectModal() {
            const modal = document.getElementById('project-modal');
            const iframe = document.getElementById('project-iframe');

            if (modal.getAttribute('aria-hidden') === 'true') return;
            modal.classList.remove('modal-active');
            modal.setAttribute('aria-hidden', 'true');
            modal.inert = true;
            iframe.src = 'about:blank';
            document.body.style.overflow = '';
            if (previouslyFocusedElement) previouslyFocusedElement.focus();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeProjectModal();
        });

        document.addEventListener("DOMContentLoaded", () => {
            loadProjects();
            document.getElementById("modal-close").addEventListener("click", closeProjectModal);
            document.getElementById("project-modal").addEventListener("click", event => {
                if (event.target.id === "project-modal") closeProjectModal();
            });

            if ("IntersectionObserver" in window && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                document.querySelectorAll('.scroll-reveal:not(.visible)').forEach(el => observer.observe(el));
            } else {
                document.querySelectorAll('.scroll-reveal').forEach(el => el.classList.add('visible'));
            }
        });
    </script>
</body>
</html>
